# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# .pre-commit-config.yaml

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.1.1
    hooks:
    -   id: black
        language_version: python3.14
        args: ["--line-length=119"]
# -   repo: https://github.com/pycqa/isort
#     rev: 8.0.1
#     hooks:
#     -   id: isort
-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        args: ["--max-line-length=119", "--extend-ignore=E203"]
-   repo: local
    hooks:
    -   id: facebook-api-tests
        name: Facebook API integration & metric tests (pre-push)
        language: system
        entry: poetry run pytest tests/test_facebook.py tests/test_facebook_http.py -m integration -q --tb=short
        stages: [pre-push]
        pass_filenames: false
        always_run: true
