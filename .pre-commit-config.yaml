# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# .pre-commit-config.yaml

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml

-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.1.1
    hooks:
    -   id: black
        language_version: python3.14
        args: ["--line-length=119"]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
    -   id: ruff-check

-   repo: local
    hooks:
    -   id: facebook-unit-tests
        name: Facebook unit tests
        language: system
        entry: poetry run pytest tests/test_facebook.py -m "not integration" -q --tb=short
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

    -   id: facebook-integrated-tests
        name: Facebook API integration (pre-push)
        language: system
        entry: poetry run pytest tests/test_facebook.py -m integration -q --tb=short
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: facebook-api-http-tests
        name: Facebook metric tests (pre-push)
        language: system
        entry: poetry run pytest tests/test_facebook_http.py -m integration -q --tb=short
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: facebook-smoke-test
        name: Facebook live smoke test
        language: system
        entry: >-
            bash -c '
            set -o pipefail;
            LOG="smoke_test_facebook_$(date +%Y%m%d_%H%M%S).log";
            poetry run python -m facebook.main --post-limit 10 --video-limit 10 --dataset govuk_facebook_dev 2>&1 | tee "$LOG";
            EXIT_CODE=${PIPESTATUS[0]};
            [ $EXIT_CODE -ne 0 ] && { echo "FAIL: exited $EXIT_CODE"; exit 1; };
            grep -q "Uploaded.*rows →" "$LOG" || { echo "FAIL: no uploads found"; exit 1; };
            echo "PASS"'
        stages: [manual]
        pass_filenames: true

    -   id: threads-unit-tests
        name: Threads unit tests
        language: system
        entry: poetry run pytest tests/test_threads.py -m "not integration" -q --tb=short
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

    -   id: threads-integrated-tests
        name: Threads API integration (pre-push)
        language: system
        entry: poetry run pytest tests/test_threads.py -m integration -q --tb=short
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: threads-api-http-tests
        name: Threads metric tests (pre-push)
        language: system
        entry: poetry run pytest tests/test_threads_http.py -m integration -q --tb=short
        stages: [pre-push]
        pass_filenames: false
        always_run: true

    -   id: threads-smoke-test
        name: threads live smoke test
        language: system
        entry: >-
            bash -c '
            set -o pipefail;
            LOG="smoke_test_threads_$(date +%Y%m%d_%H%M%S).log";
            poetry run python -m threads.main --mode daily --dataset govuk_threads_dev 2>&1 | tee "$LOG";
            EXIT_CODE=${PIPESTATUS[0]};
            [ $EXIT_CODE -ne 0 ] && { echo "FAIL: daily mode exited $EXIT_CODE"; exit 1; };
            poetry run python -m threads.main --mode snapshot --media-limit 10 --reply-limit 10 --dataset govuk_threads_dev 2>&1 | tee -a "$LOG";
            EXIT_CODE=${PIPESTATUS[0]};
            [ $EXIT_CODE -ne 0 ] && { echo "FAIL: snapshot mode exited $EXIT_CODE"; exit 1; };
            grep -q "Uploaded.*rows →" "$LOG" || { echo "FAIL: no uploads found"; exit 1; };
            echo "PASS"'
        stages: [manual]
        pass_filenames: true

    -   id: instagram-smoke-test
        name: instagram live smoke test
        language: system
        entry: >-
            bash -c '
            set -o pipefail;
            LOG="smoke_test_instagram_$(date +%Y%m%d_%H%M%S).log";
            python -m instagram.main --target-date 2026-06-08 --media-limit 10 --dataset govuk_instagram_dev 2>&1 | tee "$LOG";
            EXIT_CODE=${PIPESTATUS[0]};
            [ $EXIT_CODE -ne 0 ] && { echo "FAIL: exited $EXIT_CODE"; exit 1; };
            grep -q "Uploaded.*rows →" "$LOG" || { echo "FAIL: no uploads found"; exit 1; };
            echo "PASS"'
        stages: [manual]
        pass_filenames: true
