[tool.pytest.ini_options]
markers = [
    "integration: tests that call real external APIs",
]

[project]
name = "youtube-exploration"
version = "0.1.0"
description = ""
authors = [
    {name = "oliverroberts1-gds",email = "oliver.roberts1@digital.cabinet-office.gov.uk"}
]
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "python-facebook-api (>=0.24.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "pytest (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "google-api-python-client (>=2.192.0,<3.0.0)",
    "google-auth (>=2.48.0,<3.0.0)",
    "google-cloud (>=0.34.0,<0.35.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "google-cloud-bigquery (>=3.31.0,<4.0.0)",
    "google-cloud-secret-manager (>=2.23.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
