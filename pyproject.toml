[tool.pytest.ini_options]
markers = [
    "integration: tests that call real external APIs",
]

[project]
name = "social-data-ingestion"
version = "0.1.0"
description = ""
authors = [
    {name = "oliverroberts1-gds",email = "oliver.roberts1@digital.cabinet-office.gov.uk"}
]
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "google-api-python-client (>=2.192.0,<3.0.0)",
    "google-auth (>=2.48.0,<3.0.0)",
    "google-cloud (>=0.34.0,<0.35.0)",
    "pyarrow>=23.0.1,<27.0.0",
    "google-cloud-bigquery (>=3.31.0,<4.0.0)",
    "google-cloud-secret-manager (>=2.23.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "requests (>=2.32.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1,<5.0.0",
    "pip-system-certs>=5.3,<6.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "apache-airflow==2.11.1",
    "apache-airflow-providers-cncf-kubernetes>=10.10.0",
    "ruff>=0.17.4",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "venv",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = []
fixable = ["ALL"]
unfixable = []
extend-safe-fixes = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
