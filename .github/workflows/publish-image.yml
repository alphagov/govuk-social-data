name: Build and push image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE: europe-west2-docker.pkg.dev/gds-social-data/gds-social-data-composer-artifacts/pipeline
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1031179907628/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-actions-sa@gds-social-data.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image
        run: |
          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
