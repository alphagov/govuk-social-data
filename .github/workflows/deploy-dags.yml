name: Deploy DAGs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GCS_DAGS_BUCKET: gs://europe-west2-social-ingesti-0fc1afec-bucket
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1031179907628/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-actions-sa@gds-social-data.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy DAGs
        run: |
          gcloud storage rsync dags/ "${GCS_DAGS_BUCKET}/dags/" --recursive
