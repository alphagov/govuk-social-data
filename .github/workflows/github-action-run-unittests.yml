name: Run Pytest unnittests

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the code from the PR branch
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'           # Caches pip packages to speed up subsequent runs

    # 3. Install Poetry
    - name: Install Poetry
      run: pip install poetry=='2.3.2'

    # 4. Install dependencies via Poetry (respects poetry.lock)
    - name: Install dependencies
      run: poetry install

    # 5. Run the test suite (exclude integration tests that need live credentials)
    - name: Run tests with pytest
      run: |
        poetry run pytest tests/ -m "not integration" -q --tb=short

    # 6. Run pytest-cov and html output
    - name: Run tests with coverage
      run: poetry run pytest tests/ -m "not integration" -x -q --cov=facebook --cov=src --cov-report=html

    # 7. write coverage to job summary
    - name: Write coverage to job summary
      run: |
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        poetry run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

    # 8. upload HTML coverage report as artifcact
    - name: upload HTML covreage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: htmlcov/

    # 9. add download link to job summary
    - name: Add artifact link to summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### HTML Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "Download the full HTML report from the **Artifacts** section at the bottom of this Actions run page." >> $GITHUB_STEP_SUMMARY
